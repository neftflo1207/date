<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маленький опрос для особенного человека 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
            --text-color: #594a4e;
        }

        body {
            margin: 0;
            padding: 0;
            /* Твоя картинка фона */
            background-image: url('png.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            font-family: 'Quicksand', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            box-sizing: border-box;
            transition: all 0.4s ease;
            position: relative;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #fff5f7;
            color: var(--primary-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(255, 117, 140, 0.2);
            z-index: 10;
        }

        .btn-back:hover {
            background: #ffe3e8;
            transform: scale(1.05);
        }

        h2 {
            font-size: 24px;
            margin-top: 10px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        p {
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
            font-family: 'Quicksand', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .heart {
            font-size: 50px;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #fff5f7;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            text-align: left;
        }

        .result-box p {
            margin: 8px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div id="step-container"></div>
    </div>

    <script>
        const steps = [
            {
                id: 0,
                title: "Солнышко, у меня есть к тебе один важный вопрос...",
                text: "Но сначала нужно ответить на пару вопросов, чтобы настроиться на нужный лад ✨",
                options: [
                    { text: "Давай начнем! 🌸", target: 1 }
                ]
            },
            {
                id: 1,
                title: "Я приглашаю тебя на нишевое свидание, которое будет заключаться в ремонте машины",
                text: "Выбери напиток, который мы возьмем с собой:",
                options: [
                    { text: "☕ Горячий шоколоад", answer: "Горячий шоколад 🍰", target: 2 },
                    { text: "🧃 Сок", answer: "Сок 🧃", target: 2 },
                    { text: "✨ Что-то особое", answer: "Секретный напиток 🌙", target: 2 }
                ]
            },
            {
                id: 2,
                title: "Что насчет угощений?",
                text: "Тут тоже можно капризничать:",
                options: [
                    { text: "🍷 Сладости, морожененое, мармелад", answer: "Вкусняшки: Ням ☕", target: 3 },
                    { text: "🍕 Снеки, пицца или донер", answer: "Вкусняшки: Обязательно будут 🍕", target: 3 }
                ]
            },
            {
                id: 3,
                title: "Заеду за тобой в пятницу",
                text: "Будь готова",
                options: [
                    { text: "🗓️ Ура", answer: "День: Ура ✨", target: 4 },
                    { text: "🗓️ ХиХиХи", answer: "День: ХиХиХи ☀️", target: 4 },
                    { text: "🗓️ Укушу тебя", answer: "День: Кусь 🌷", target: 4 }
                ]
            },
            {
                id: 4,
                title: "Идеально, ты умница! 🎉",
                text: "Все ответы записаны. Осталось только подтвердить бронь на самое лучшее свидание:",
                isFinal: true,
                options: [
                    { text: "Сдаться и пойти ❤️", target: 5 }
                ]
            }
        ];

        let currentStepId = 0;
        // История посещенных шагов для корректной работы кнопки «Назад»
        let historyStack = [];
        let userChoices = {};

        function renderStep() {
            const container = document.getElementById('step-container');
            const step = steps.find(s => s.id === currentStepId);

            let html = '';

            // Кнопка «Назад» показывается, если в истории есть шаги
            if (historyStack.length > 0) {
                html += `<button class="btn-back" onclick="handleBack()" title="Назад">←</button>`;
            }

            html += `<div class="heart">💌</div>`;
            html += `<h2>${step.title}</h2><p>${step.text}</p>`;

            if (step.isFinal) {
                html += `<div class="result-box">
                    <p><b>Твой выбор:</b></p>
                    <p>• ${userChoices[1] || 'Уютное место'}</p>
                    <p>• ${userChoices[2] || 'Вкусности'}</p>
                    <p>• ${userChoices[3] || 'Выходной день'}</p>
                </div><br>`;
            }

            html += `<div class="options">`;
            step.options.forEach((opt) => {
                html += `<button class="btn" onclick="handleChoice(${opt.target}, '${opt.answer || ''}')">${opt.text}</button>`;
            });
            html += `</div>`;

            container.innerHTML = html;
        }

        function handleChoice(targetStep, answer) {
            if (answer && currentStepId > 0) {
                userChoices[currentStepId] = answer;
            }
            
            if (targetStep === 5) {
                document.getElementById('app').innerHTML = `
                    <div class="heart">💖</div>
                    <h2>Ура! Жду не дождусь!</h2>
                    <p>Скриншот этого экрана нужно прислать мне в личку, чтобы зафиксировать бронь 💌</p>
                    <p style="font-size: 14px; color: #666; margin-top: 20px;">(Обещаю сделать этот вечер особенным)</p>
                `;
                return;
            }

            // Запоминаем текущий шаг в историю перед переходом вперед
            historyStack.push(currentStepId);
            currentStepId = targetStep;
            renderStep();
        }

        function handleBack() {
            if (historyStack.length > 0) {
                // Достаем последний сохраненный шаг из истории
                currentStepId = historyStack.pop();
                renderStep();
            }
        }

        renderStep();
    </script>
</body>
</html>
